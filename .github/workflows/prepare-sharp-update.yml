name: One-time audited sharp security update
on:
  push:
    branches: [feat/issue-7-portainer-production-deployment]
    paths:
      - '.github/workflows/prepare-sharp-update.yml'
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-7-portainer-production-deployment
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Upgrade patched sharp and update lockfile together
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact sharp@0.35.5
      - name: Commit pinned sharp and lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security: update sharp to patched 0.35.5 and lock transitive dependencies"
            git push origin HEAD:feat/issue-7-portainer-production-deployment
          fi
