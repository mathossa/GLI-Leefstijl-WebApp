# One-time workflow; removed when the reproducible lockfile is committed.
name: Bootstrap npm lockfile (issue 1 only)
on:
  push:
    branches: [feat/issue-1-app-shell-design-system]

permissions:
  contents: write

jobs:
  lock:
    if: github.repository == 'mathossa/GLI-Leefstijl-WebApp'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check if lockfile is needed
        id: check
        run: |
          if [ -f package-lock.json ]; then
            echo "needs_lock=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_lock=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve dependency graph without executing install scripts
        if: steps.check.outputs.needs_lock == 'true'
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile to feature branch only
        if: steps.check.outputs.needs_lock == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: pin npm dependency graph for issue 1"
          git push origin HEAD:feat/issue-1-app-shell-design-system
