name: One-time SMTP dependency lockfile update
on:
  push:
    branches: [feat/issue-6-admin-smtp-relay]
    paths:
      - '.github/workflows/prepare-smtp-lock.yml'

permissions:
  contents: write

jobs:
  prepare-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-6-admin-smtp-relay
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Preserve PDF/photo dependencies and add Nodemailer to lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact nodemailer@10.2.1
      - name: Commit reproducible lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: lock Nodemailer without dropping PDF and Sharp"
            git push origin HEAD:feat/issue-6-admin-smtp-relay
          fi
