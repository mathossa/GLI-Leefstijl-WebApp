name: One-time PDF and image package lock preparation
on:
  push:
    branches: [feat/issue-5-reflections-insights-export]
    paths: ['.github/workflows/prepare-pdf-lock.yml']

permissions:
  contents: write

jobs:
  prepare-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-5-reflections-insights-export
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve MIT/Apache-2.0 dependencies into npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact pdf-lib@1.17.1 sharp@0.34.5
      - name: Commit reproducible package-lock.json
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: lock pdf-lib and sharp dependencies for issue 5"
            git push origin HEAD:feat/issue-5-reflections-insights-export
          fi
