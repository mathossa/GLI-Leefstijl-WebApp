# Docker Compose v2 / Portainer Docker Standalone (not Docker Swarm).
name: mijn-leefstijl

services:
  postgres:
    image: postgres:17.11-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-leefstijl}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - leefstijl_pg_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"

  migrate:
    image: ${MIGRATOR_IMAGE:?Set MIGRATOR_IMAGE}
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - database
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      options:
        max-size: 10m
        max-file: "3"

  app:
    image: ${APP_IMAGE:?Set APP_IMAGE}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      SMTP_ENCRYPTION_KEY: ${SMTP_ENCRYPTION_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - database
      - proxy
    # Intentionally no published ports; only proxy network reaches app:3000.
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.mjs"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      options:
        max-size: 10m
        max-file: "3"

volumes:
  leefstijl_pg_data:

networks:
  database:
    internal: true
  proxy:
    external: true
    name: ${PROXY_NETWORK:?Set PROXY_NETWORK to your TLS proxy network}
